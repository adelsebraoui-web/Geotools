    <title>GEOMETRI SYSTEM</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; position: fixed; width: 100%; z-index: 9999; background: #000; }
        .login-box { border: 2px solid #0f0; padding: 40px; text-align: center; background: rgba(0,20,0,0.95); box-shadow: 0 0 30px #0f0; }
        #app { display: none; height: 100vh; flex-direction: column; background: #050505; }

        .nav-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px; overflow-y: auto; }
        .nav-card {

            padding: 40px; cursor: pointer; text-align: center; transition: 0.3s;
        }
        .nav-card:hover { transform: translateY(-10px); box-shadow: 0 0 30px #0f0; background: rgba(0, 255, 0, 0.15); }
        .nav-card h2 { margin: 0; font-size: 22px; letter-spacing: 3px; }

        #view-container { display: none; height: 100vh; flex-direction: column; }
        iframe { width: 100%; flex-grow: 1; border: none; background: #fff; }
        .back-btn { background: #000; color: #0f0; border: 1px solid #0f0; padding: 12px 25px; cursor: pointer; margin: 10px; font-weight: bold; }
    </style>
</head>

        function check() {
            if(document.getElementById('pw').value.toLowerCase() === 'geo') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                buildMenu();
            } else { alert("INVALID ACCESS"); }
        }

        function buildMenu() {
            const menu = document.getElementById('menu');
            menu.innerHTML = '';
            tabs.forEach((tab, i) => {
                const card = document.createElement('div');
                card.className = 'nav-card';
                card.innerHTML = '<h2>' + tab.name.toUpperCase() + '</h2><div style="margin-top:15px; color:#0ff; font-size:10px;">INITIALIZE MODULE</div>';
                card.onclick = () => openTab(i);
                menu.appendChild(card);
            });
        }

        function openTab(i) {
            document.getElementById('app').style.display = 'none';
            document.getElementById('view-container').style.display = 'flex';
            const target = document.getElementById('iframe-target');
            target.innerHTML = '';
            const ifrm = document.createElement('iframe');
            target.appendChild(ifrm);
            const d = ifrm.contentWindow.document;
            d.open(); d.write(tabs[i].content); d.close();
        }

        function goBack() {
            document.getElementById('app').style.display = 'flex';
            document.getElementById('view-container').style.display = 'none';
        }
    </script>
